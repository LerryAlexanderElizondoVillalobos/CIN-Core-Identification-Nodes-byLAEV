name: CIN Specification Validation

# Specification checks are paused during the clean Main reconstruction.
# Manual dispatch remains available for an explicitly requested diagnostic.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    name: Specification validation paused for Main reset
    runs-on: ubuntu-latest
    steps:
      - name: Report reset state
        run: |
          echo "CIN Main reset is in progress."
          echo "Legacy specification and schema validation are intentionally not executed."
          echo "Reintroduce checks only when the new baseline defines their scope."
