name: CIN Core Library

on:
  pull_request:
    branches: [main]
    paths:
      - "prototype/cin-core/**"
      - ".github/workflows/cin-core.yml"
  push:
    branches: [main]
    paths:
      - "prototype/cin-core/**"
      - ".github/workflows/cin-core.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --manifest-path prototype/cin-core/Cargo.toml --all -- --check
      - name: Lint
        run: cargo clippy --manifest-path prototype/cin-core/Cargo.toml --all-targets -- -D warnings
      - name: Compile
        run: cargo check --manifest-path prototype/cin-core/Cargo.toml --all-targets
      - name: Unit tests
        run: cargo test --manifest-path prototype/cin-core/Cargo.toml --all-targets
