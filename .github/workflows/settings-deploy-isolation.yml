name: CIN Settings — Official Code Deployment and Installer

on:
  push:
    branches: [main, "stage/settings-deploy-network-isolation"]
    paths:
      - "MAIN/app/launcher/**"
      - "MAIN/app/settings/deployment/**"
      - "MAIN/tests/settings/**"
      - "MAIN/installer/linux/**"
      - "MAIN/packaging/deb/**"
      - "MAIN/docs/settings/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  pull_request:
    paths:
      - "MAIN/app/launcher/**"
      - "MAIN/app/settings/deployment/**"
      - "MAIN/tests/settings/**"
      - "MAIN/installer/linux/**"
      - "MAIN/packaging/deb/**"
      - "MAIN/docs/settings/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-deploy-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Deployment engine and application contract tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run application contract tests
        run: python3 -m unittest MAIN.tests.test_application_contract -v
      - name: Run deployment engine tests
        env:
          PYTHONPATH: MAIN/app
        run: python3 -m unittest discover -s MAIN/tests/settings -p "test_*.py" -v
      - name: Validate Python syntax
        run: python3 -m compileall -q MAIN/app

  runtime-qualification:
    name: GTK runtime on ${{ matrix.runner }}
    needs: source-tests
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install CI-only GTK and display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 xvfb dbus-x11
      - name: Run Lobby and Settings navigation smoke test
        env:
          GDK_BACKEND: x11
          PYTHONPATH: MAIN/app
        run: xvfb-run -a dbus-run-session -- python3 MAIN/app/launcher/cin_main.py --smoke-test

  build-deb:
    name: Build and inspect CIN.deb
    needs: [source-tests, runtime-qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build CIN.deb
        run: bash MAIN/installer/linux/build-deb.sh dist
      - name: Inspect Debian payload
        run: |
          set -euo pipefail
          test -s dist/CIN.deb
          test "$(dpkg-deb --field dist/CIN.deb Architecture)" = "all"
          dpkg-deb --field dist/CIN.deb Package Version Architecture
          dpkg-deb --contents dist/CIN.deb
          dpkg-deb --extract dist/CIN.deb /tmp/cin-package-inspect
          test -f /tmp/cin-package-inspect/opt/cin-main-lobby/cin_main.py
          test -f /tmp/cin-package-inspect/opt/cin-main-lobby/settings/deployment/engine.py
          bash -n dist/install-user.sh
          bash -n dist/uninstall-user.sh
      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: cin-deploy-candidate
          path: |
            dist/CIN.deb
            dist/install-user.sh
            dist/uninstall-user.sh
          if-no-files-found: error
          retention-days: 3

  install-test:
    name: Bootstrap install and migration test
    needs: build-deb
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: cin-deploy-candidate
          path: dist
      - name: Provision CI-only runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 xvfb dbus-x11 openssl
      - name: Simulate prior installation and preserve operator data
        run: |
          mkdir -p "$HOME/.local/opt/cin-main-lobby" "$HOME/.local/share/cin-main-lobby" "$HOME/.config/cin-main-lobby"
          echo old-build > "$HOME/.local/opt/cin-main-lobby/old.txt"
          echo keep-me > "$HOME/.local/share/cin-main-lobby/operator-data.txt"
          echo keep-key-config > "$HOME/.config/cin-main-lobby/operator-config.txt"
      - name: Install new bootstrap package as unprivileged user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          bash dist/install-user.sh "$PWD/dist/CIN.deb"
          test -f "$HOME/.local/opt/cin-main-lobby/cin_main.py"
          test -f "$HOME/.local/opt/cin-main-lobby/settings/deployment/engine.py"
          test ! -e "$HOME/.local/opt/cin-main-lobby/old.txt"
          grep -q keep-me "$HOME/.local/share/cin-main-lobby/operator-data.txt"
          grep -q keep-key-config "$HOME/.config/cin-main-lobby/operator-config.txt"
          test -x "$HOME/.local/bin/cin-main"
      - name: Launch installed application
        env:
          GDK_BACKEND: x11
          PYTHONPATH: ${{ github.workspace }}/MAIN/app
        run: xvfb-run -a dbus-run-session -- "$HOME/.local/bin/cin-main" --smoke-test
      - name: Uninstall application without deleting operator data
        if: always()
        run: |
          if [[ -f dist/uninstall-user.sh ]]; then bash dist/uninstall-user.sh; fi
          test ! -e "$HOME/.local/opt/cin-main-lobby"
          test ! -e "$HOME/.local/bin/cin-main"
          test -f "$HOME/.local/share/cin-main-lobby/operator-data.txt"
          test -f "$HOME/.config/cin-main-lobby/operator-config.txt"

  publish:
    name: Publish qualified CIN-deb-installer
    needs: install-test
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: cin-deploy-candidate
          path: dist
      - uses: actions/upload-artifact@v4
        with:
          name: CIN-deb-installer
          path: |
            dist/CIN.deb
            dist/install-user.sh
            dist/uninstall-user.sh
          if-no-files-found: error
          retention-days: 30
