name: CIN — Linux ARM64 packages

on:
  push:
    branches: [main]
    paths:
      - "MAIN/app/**"
      - "MAIN/tests/**"
      - "MAIN/installer/linux/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-linux-arm64-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-tests:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Run CIN source tests
        run: python3 -m unittest discover -s MAIN/tests -v
      - name: Validate application and installer syntax
        run: |
          python3 -m compileall -q MAIN/app MAIN/installer/linux/appimage_installer.py
          bash -n MAIN/installer/linux/AppRun
          bash -n MAIN/installer/linux/build-appimage.sh
          bash -n MAIN/installer/linux/build-deb-arm64.sh

  build-appimage:
    needs: source-tests
    timeout-minutes: 25
    runs-on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time GTK and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev python3-gi python3-cairo gir1.2-gtk-4.0 libcairo2-dev libgirepository1.0-dev librsvg2-bin desktop-file-utils patchelf gcc pkg-config file wget
      - name: Download architecture-matched linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage" -O linuxdeploy
          chmod 0755 linuxdeploy
          sudo install -m 0755 linuxdeploy /usr/local/bin/linuxdeploy
      - name: Build AppImage
        run: bash MAIN/installer/linux/build-appimage.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Inspect artifact and verify embedded CIN modules
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGE="dist/Core_Identification_Nodes-aarch64.AppImage"
          test -s "$APPIMAGE"
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/cin-main
          test -x squashfs-root/usr/bin/cin-appimage-installer
          test -d squashfs-root/usr/lib/girepository-1.0
          test -n "$(find squashfs-root/usr/lib/girepository-1.0 -name 'Gtk-4.0.typelib' -print -quit)"
          test -n "$(find squashfs-root/usr/lib -name 'libgtk-4.so*' -print -quit)"
          rm -rf squashfs-root
          sha256sum "$APPIMAGE"
      - name: Smoke-test bundled Main Lobby inside the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GDK_BACKEND: x11
        run: |
          dbus-run-session -- xvfb-run -a "dist/Core_Identification_Nodes-${{ matrix.arch }}.AppImage" --run --smoke-test
      - name: Build Debian ARM64 package
        run: bash MAIN/installer/linux/build-deb-arm64.sh
      - name: Upload ARM64 AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Core_Identification_Nodes-aarch64.AppImage
          path: dist/Core_Identification_Nodes-aarch64.AppImage
          if-no-files-found: error
          retention-days: 30
      - name: Upload Debian ARM64 package
        uses: actions/upload-artifact@v4
        with:
          name: Core_Identification_Nodes-arm64.deb
          path: dist/Core_Identification_Nodes-arm64.deb
          if-no-files-found: error
          retention-days: 30
