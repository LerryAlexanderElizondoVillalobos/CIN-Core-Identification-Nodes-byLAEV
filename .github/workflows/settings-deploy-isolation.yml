name: CIN — Linux AppImage

on:
  push:
    branches: [main]
    paths:
      - "MAIN/app/**"
      - "MAIN/tests/**"
      - "MAIN/installer/linux/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/settings-deploy-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-appimage-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run CIN source tests
        run: python3 -m unittest discover -s MAIN/tests -v
      - name: Validate application and installer syntax
        run: |
          python3 -m compileall -q MAIN/app MAIN/installer/linux/appimage_installer.py
          bash -n MAIN/installer/linux/AppRun
          bash -n MAIN/installer/linux/build-appimage.sh

  build-appimage:
    needs: source-tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x86_64
            linuxdeploy: linuxdeploy-x86_64.AppImage
          - runner: ubuntu-24.04-arm
            arch: aarch64
            linuxdeploy: linuxdeploy-aarch64.AppImage
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build-time GTK and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-dev python3-gi python3-cairo gir1.2-gtk-4.0 libcairo2-dev libgirepository-2.0-dev gcc pkg-config file wget
      - name: Download architecture-matched linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/${{ matrix.linuxdeploy }}" -O linuxdeploy
          chmod 0755 linuxdeploy
          sudo install -m 0755 linuxdeploy /usr/local/bin/linuxdeploy
      - name: Build AppImage
        run: bash MAIN/installer/linux/build-appimage.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
      - name: Inspect artifact and verify embedded CIN modules
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          set -euo pipefail
          APPIMAGE="dist/Core_Identification_Nodes-${{ matrix.arch }}.AppImage"
          test -s "$APPIMAGE"
          test -x "$APPIMAGE"
          "$APPIMAGE" --appimage-extract >/dev/null
          test -x squashfs-root/AppRun
          test -x squashfs-root/usr/bin/cin-main
          test -x squashfs-root/usr/bin/cin-appimage-installer
          rm -rf squashfs-root
          sha256sum "$APPIMAGE"
      - name: Provision CI user systemd manager for scoped network test
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11
          sudo loginctl enable-linger "$(id -un)"
          sudo systemctl start "user@$(id -u).service"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$(id -u)/bus" >> "$GITHUB_ENV"
      - name: Smoke-test bundled Main Lobby inside the AppImage
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GDK_BACKEND: x11
        run: |
          xvfb-run -a "dist/Core_Identification_Nodes-${{ matrix.arch }}.AppImage" --run --smoke-test
      - name: Upload architecture-specific AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Core_Identification_Nodes-${{ matrix.arch }}.AppImage
          path: dist/Core_Identification_Nodes-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 30
