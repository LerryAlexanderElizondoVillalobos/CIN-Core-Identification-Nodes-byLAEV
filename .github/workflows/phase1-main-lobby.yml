name: CIN Main — Build, Test and Package Debian Installer

on:
  push:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-main-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Validate source and application contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run source contract tests
        run: python3 -m unittest discover -s MAIN/tests -v

  build-test-package:
    name: Build and test CIN Debian package
    runs-on: ubuntu-24.04
    needs: source-tests
    steps:
      - uses: actions/checkout@v4

      - name: Install native GTK runtime and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 xvfb dbus-x11 dpkg-dev desktop-file-utils

      - name: Prepare Debian package tree
        run: |
          set -euo pipefail
          chmod 0755 MAIN/packaging/deb/usr/bin/cin-main
          chmod 0755 MAIN/packaging/deb/DEBIAN/postinst
          chmod 0755 MAIN/packaging/deb/DEBIAN/postrm
          install -d MAIN/packaging/deb/usr/lib/cin-main-lobby
          install -m 0644 MAIN/app/launcher/cin_main.py MAIN/packaging/deb/usr/lib/cin-main-lobby/cin_main.py
          install -d dist

      - name: Build Debian package
        run: |
          set -euo pipefail
          dpkg-deb --build --root-owner-group MAIN/packaging/deb dist/CIN.deb
          dpkg-deb --info dist/CIN.deb
          dpkg-deb --contents dist/CIN.deb
          dpkg-deb --field dist/CIN.deb Package Version Architecture Depends

      - name: Validate desktop entry
        run: desktop-file-validate MAIN/packaging/deb/usr/share/applications/cin-main.desktop

      - name: Install package in CI environment
        run: |
          sudo apt-get install -y ./dist/CIN.deb
          dpkg-query -W cin-main-lobby

      - name: Launch installed application and test two-screen navigation
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- /usr/bin/cin-main --smoke-test

      - name: Verify package removal
        if: always()
        run: |
          sudo dpkg --purge cin-main-lobby || true

      - name: Upload installable Debian package
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: CIN-deb-installer
          path: dist/CIN.deb
          if-no-files-found: error
          retention-days: 30
