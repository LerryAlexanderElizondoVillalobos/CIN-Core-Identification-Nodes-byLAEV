name: CIN Main — Build, Test and Package Debian Installer

on:
  push:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-main-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Validate source and application contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run source contract tests
        run: python3 -m unittest discover -s MAIN/tests -v

  build-package:
    name: Build architecture-independent Debian package
    runs-on: ubuntu-24.04
    needs: source-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev desktop-file-utils
      - name: Build CIN.deb
        run: bash MAIN/installer/linux/build-deb.sh dist
      - name: Validate desktop entry
        run: desktop-file-validate MAIN/packaging/deb/usr/share/applications/cin-main.desktop
      - name: Upload package candidate for runtime qualification
        uses: actions/upload-artifact@v4
        with:
          name: cin-deb-candidate
          path: dist/CIN.deb
          if-no-files-found: error
          retention-days: 3

  runtime-qualification:
    name: Install and launch on ${{ matrix.runner }}
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@v4
        with:
          name: cin-deb-candidate
          path: dist
      - name: Install GTK runtime and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 xvfb dbus-x11
      - name: Inspect package architecture and dependencies
        run: |
          set -euo pipefail
          dpkg-deb --info dist/CIN.deb
          dpkg-deb --field dist/CIN.deb Package Version Architecture Depends
          test "$(dpkg-deb --field dist/CIN.deb Architecture)" = "all"
      - name: Install package
        run: |
          sudo apt-get install -y ./dist/CIN.deb
          dpkg-query -W cin-main-lobby
      - name: Launch installed application and test two-screen navigation
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- /usr/bin/cin-main --smoke-test
      - name: Remove package after qualification
        if: always()
        run: sudo dpkg --purge cin-main-lobby || true

  publish-artifact:
    name: Publish downloadable CIN.deb artifact
    needs:
      - build-package
      - runtime-qualification
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download qualified package
        uses: actions/download-artifact@v4
        with:
          name: cin-deb-candidate
          path: dist
      - name: Publish installable package
        uses: actions/upload-artifact@v4
        with:
          name: CIN-deb-installer
          path: dist/CIN.deb
          if-no-files-found: error
          retention-days: 30
