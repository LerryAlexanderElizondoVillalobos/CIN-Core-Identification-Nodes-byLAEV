name: CIN Phase 1 — Main Lobby First Milestone

on:
  push:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lobby-contract:
    name: Validate first Lobby milestone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required project documents
        shell: bash
        run: |
          set -euo pipefail
          test -f MAIN/README.md
          test -f MAIN/WORKPLAN_PHASE_1.md
          test -f MAIN/installer/linux/README.md
          test -f MAIN/lobby/README.md

      - name: Validate welcome screen and Create-only scope
        shell: python
        run: |
          from pathlib import Path

          main = Path("MAIN/README.md").read_text(encoding="utf-8")
          plan = Path("MAIN/WORKPLAN_PHASE_1.md").read_text(encoding="utf-8")
          installer = Path("MAIN/installer/linux/README.md").read_text(encoding="utf-8")
          lobby = Path("MAIN/lobby/README.md").read_text(encoding="utf-8")
          all_docs = "\n".join((main, plan, installer, lobby))

          required = (
              "Welcome to Core Identification Nodes",
              "Create",
              "Enter",
              "Import",
              "CIN Package Engine",
              "Phase 2",
          )
          missing = [item for item in required if item not in all_docs]
          if missing:
              raise SystemExit("Missing first-milestone requirements: " + ", ".join(missing))

          if "only active and implemented action" not in main:
              raise SystemExit("MAIN overview must state that Create is the only active action")

          if "visible but inactive" not in lobby:
              raise SystemExit("Enter and Import must remain visible but inactive")

          if "must not invent node identifiers" not in lobby:
              raise SystemExit("Create shell must not fabricate node records or identifiers")

          print("PASS: first Lobby milestone contract is consistent.")
          print("NOTE: This job checks project scope and documentation, not a built application.")

  package-build:
    name: Build Linux package when packaging scaffold exists
    runs-on: ubuntu-latest
    needs: lobby-contract
    if: ${{ hashFiles('MAIN/packaging/deb/DEBIAN/control') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build and inspect ARM64 Debian package
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^Architecture: arm64$' MAIN/packaging/deb/DEBIAN/control
          mkdir -p dist
          dpkg-deb --build --root-owner-group MAIN/packaging/deb dist/cin-main-lobby_0.1.0_arm64.deb
          dpkg-deb --info dist/cin-main-lobby_0.1.0_arm64.deb
          dpkg-deb --contents dist/cin-main-lobby_0.1.0_arm64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: cin-main-lobby-arm64-deb
          path: dist/*.deb
          if-no-files-found: error
