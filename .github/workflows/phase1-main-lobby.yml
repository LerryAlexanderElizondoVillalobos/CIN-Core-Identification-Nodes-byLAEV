name: CIN Main — Build, Test and Package Debian Installer

on:
  push:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-main-deb-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-tests:
    name: Validate source and application contract
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Run source contract tests
        run: python3 -m unittest discover -s MAIN/tests -v

  build-package:
    name: Build user-space Debian package
    runs-on: ubuntu-24.04
    needs: source-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev
      - name: Build CIN.deb and user-space installer scripts
        run: bash MAIN/installer/linux/build-deb.sh dist
      - name: Validate package payload and installer scripts
        run: |
          set -euo pipefail
          dpkg-deb --field dist/CIN.deb Package Version Architecture
          test "$(dpkg-deb --field dist/CIN.deb Architecture)" = "all"
          bash -n dist/install-user.sh
          bash -n dist/uninstall-user.sh
          dpkg-deb --contents dist/CIN.deb
      - name: Upload package candidate
        uses: actions/upload-artifact@v4
        with:
          name: cin-deb-candidate
          path: |
            dist/CIN.deb
            dist/install-user.sh
            dist/uninstall-user.sh
          if-no-files-found: error
          retention-days: 3

  runtime-qualification:
    name: User-space install and launch on ${{ matrix.runner }}
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Download package candidate
        uses: actions/download-artifact@v4
        with:
          name: cin-deb-candidate
          path: dist
      - name: Provision CI runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-gi gir1.2-gtk-4.0 xvfb dbus-x11
      - name: Inspect package architecture
        run: |
          set -euo pipefail
          dpkg-deb --info dist/CIN.deb
          test "$(dpkg-deb --field dist/CIN.deb Architecture)" = "all"
      - name: Install CIN for the current unprivileged user
        run: |
          set -euo pipefail
          test "$(id -u)" -ne 0
          bash dist/install-user.sh "$PWD/dist/CIN.deb"
          test -f "$HOME/.local/opt/cin-main-lobby/cin_main.py"
          test -x "$HOME/.local/bin/cin-main"
          test -f "$HOME/.local/share/applications/cin-main.desktop"
      - name: Launch installed application and test two-screen navigation
        env:
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          xvfb-run -a dbus-run-session -- "$HOME/.local/bin/cin-main" --smoke-test
      - name: Uninstall CIN as the current user
        if: always()
        run: |
          if [ -f dist/uninstall-user.sh ]; then
            bash dist/uninstall-user.sh
          fi
          test ! -e "$HOME/.local/opt/cin-main-lobby"
          test ! -e "$HOME/.local/bin/cin-main"

  publish-artifact:
    name: Publish downloadable CIN.deb user installer
    needs:
      - build-package
      - runtime-qualification
    if: success() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - name: Download qualified user-space installer bundle
        uses: actions/download-artifact@v4
        with:
          name: cin-deb-candidate
          path: dist
      - name: Publish installer bundle
        uses: actions/upload-artifact@v4
        with:
          name: CIN-deb-installer
          path: |
            dist/CIN.deb
            dist/install-user.sh
            dist/uninstall-user.sh
          if-no-files-found: error
          retention-days: 30
