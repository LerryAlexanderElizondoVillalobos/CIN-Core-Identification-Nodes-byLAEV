name: CIN Phase 1 — Minimal Adaptive Main Lobby

on:
  push:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/phase1-main-lobby.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-phase1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lobby-contract:
    name: Validate minimal adaptive Lobby specification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required project documents
        run: |
          set -euo pipefail
          test -f MAIN/README.md
          test -f MAIN/WORKPLAN_PHASE_1.md
          test -f MAIN/installer/linux/README.md
          test -f MAIN/lobby/README.md

      - name: Validate first-screen content, resource and layout requirements
        shell: python
        run: |
          from pathlib import Path

          plan = Path("MAIN/WORKPLAN_PHASE_1.md").read_text(encoding="utf-8")
          installer = Path("MAIN/installer/linux/README.md").read_text(encoding="utf-8")
          lobby = Path("MAIN/lobby/README.md").read_text(encoding="utf-8")
          docs = "\n".join((plan, installer, lobby))

          required = (
              "Welcome to the Main Lobby",
              "Core Identification Nodes",
              "Create",
              "Enter",
              "Import",
              "Settings",
              "landscape",
              "portrait",
              "flat",
              "text-only",
              "repository",
              "© 2026 Core Identification Nodes byLAEV",
          )
          missing = [item for item in required if item.lower() not in docs.lower()]
          if missing:
              raise SystemExit("Missing Lobby requirements: " + ", ".join(missing))

          if "only Create is active" not in installer:
              raise SystemExit("Installer specification must keep Create as the only active action")

          if "no fixed-aspect canvas" not in installer:
              raise SystemExit("Installer specification must prohibit a fixed-aspect canvas")

          if "must reflow" not in lobby:
              raise SystemExit("Lobby specification must require responsive reflow")

          print("PASS: minimal adaptive Lobby requirements are documented.")
          print("NOTE: this is a specification check, not a runtime UI or memory benchmark.")

  package-build:
    name: Build Linux package when packaging scaffold exists
    runs-on: ubuntu-latest
    needs: lobby-contract
    if: ${{ hashFiles('MAIN/packaging/deb/DEBIAN/control') != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev

      - name: Build and inspect ARM64 Debian package
        shell: bash
        run: |
          set -euo pipefail
          grep -Eq '^Architecture: arm64$' MAIN/packaging/deb/DEBIAN/control
          mkdir -p dist
          dpkg-deb --build --root-owner-group MAIN/packaging/deb dist/cin-main-lobby_0.1.0_arm64.deb
          dpkg-deb --info dist/cin-main-lobby_0.1.0_arm64.deb
          dpkg-deb --contents dist/cin-main-lobby_0.1.0_arm64.deb

      - uses: actions/upload-artifact@v4
        with:
          name: cin-main-lobby-arm64-deb
          path: dist/*.deb
          if-no-files-found: error
