name: CIN Linux Local Web End-to-End Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "prototype/linux-runtime/**"
      - "prototype/dist/**"
      - "scripts/package-linux-zip.sh"
      - "e2e/**"
      - ".github/workflows/linux-desktop-e2e.yml"
  push:
    branches: [main]
    paths:
      - "prototype/linux-runtime/**"
      - "prototype/dist/**"
      - "scripts/package-linux-zip.sh"
      - "e2e/**"
      - ".github/workflows/linux-desktop-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-linux-local-web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-local-web:
    name: Build, serve local web UI, test ports and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run runtime unit tests
        working-directory: prototype/linux-runtime
        run: cargo test

      - name: Build local web runtime
        working-directory: prototype/linux-runtime
        run: cargo build --release

      - name: Package portable ZIP
        run: bash scripts/package-linux-zip.sh prototype/linux-runtime/target/release/cin-linux-prototype

      - name: Verify package checksum and layout
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c CIN-Linux-Portable-x86_64.zip.sha256
          unzip -q CIN-Linux-Portable-x86_64.zip -d package-check
          test -x package-check/CIN-Linux-Portable-x86_64/run-cin.sh
          test -x package-check/CIN-Linux-Portable-x86_64/cin

      - name: Run local HTTP, port selection and relocation acceptance tests
        working-directory: e2e
        run: npm run test:web
