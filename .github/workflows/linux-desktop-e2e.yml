name: CIN Linux Local Web End-to-End Acceptance

on:
  pull_request:
    branches: [main]
    paths:
      - "Main/runtime/linux-portable/**"
      - "Main/interfaces/local-web/**"
      - "Main/installation/linux/package-portable.sh"
      - "e2e/**"
      - ".github/workflows/linux-desktop-e2e.yml"
  push:
    branches: [main]
    paths:
      - "Main/runtime/linux-portable/**"
      - "Main/interfaces/local-web/**"
      - "Main/installation/linux/package-portable.sh"
      - "e2e/**"
      - ".github/workflows/linux-desktop-e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-linux-local-web-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-local-web:
    name: Build, serve local web UI, test ports and persistence
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run runtime unit tests
        working-directory: Main/runtime/linux-portable
        run: cargo test

      - name: Build local web runtime
        working-directory: Main/runtime/linux-portable
        run: cargo build --release

      - name: Package portable ZIP
        run: bash Main/installation/linux/package-portable.sh Main/runtime/linux-portable/target/release/cin-linux-main

      - name: Verify package checksum and layout
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c CIN-Linux-Portable-x86_64.zip.sha256
          unzip -q CIN-Linux-Portable-x86_64.zip -d package-check
          test -x package-check/CIN-Linux-Portable-x86_64/run-cin.sh
          test -x package-check/CIN-Linux-Portable-x86_64/cin

      - name: Install Playwright and Chromium
        run: |
          npm install --prefix e2e --no-save --package-lock=false playwright@1.56.1
          e2e/node_modules/.bin/playwright install --with-deps chromium

      - name: Run local HTTP, port selection, relocation and Chromium acceptance tests
        run: |
          set -euo pipefail
          export CIN_CHROMIUM_PATH="$(node -p "require('./e2e/node_modules/playwright').chromium.executablePath()")"
          test -x "$CIN_CHROMIUM_PATH"
          npm --prefix e2e run test:web
