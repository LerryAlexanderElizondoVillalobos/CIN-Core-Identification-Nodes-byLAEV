name: CIN Global Personal Document Validation

on:
  push:
    paths:
      - "Core Identification Node Github/**"
      - ".github/workflows/cin-global-personal-document.yml"
  pull_request:
    paths:
      - "Core Identification Node Github/**"
      - ".github/workflows/cin-global-personal-document.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Lobby JavaScript syntax
        run: node --check "Core Identification Node Github/cin-github-lobby.js"
      - name: Validate certificate and schema contracts
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const root = 'Core Identification Node Github/';
          const readJson = path => JSON.parse(fs.readFileSync(root + path, 'utf8'));
          const certificate = readJson('CIN-GLOBAL-PERSONAL-DOCUMENT.cincert');
          const personalSchema = readJson('Documentation/Architecture/schemas/CIN-GLOBAL-PERSONAL-DOCUMENT.schema.json');
          const marriageSchema = readJson('Documentation/Architecture/schemas/CIN-NODE-PERSONAL-DOCUMENT-MARRIAGE.schema.json');
          const lobby = fs.readFileSync(root + 'cin-github-lobby.js', 'utf8');
          const html = fs.readFileSync(root + 'index.html', 'utf8');
          const serviceWorker = fs.readFileSync(root + 'service-worker.js', 'utf8');

          assert.equal(certificate.certificate_type, 'cin.global-personal-document-marriage');
          assert.equal(certificate.certificate_version, '1.0.0');
          assert.equal(certificate.execution.action, 'create-global-personal-document-and-sign-node-marriage');
          assert.equal(certificate.identifier_derivation.algorithm, 'SHA-256');
          assert.equal(certificate.identifier_derivation.signature_bytes_excluded, true);
          assert.equal(certificate.marriage_agreement.signature_standard, 'EIP-712');
          assert.ok(certificate.marriage_agreement.signed_fields.includes('termsSha256'));
          assert.equal(certificate.outputs.personal_document.document_type, 'cin.global-personal-document-candidate');
          assert.equal(certificate.outputs.marriage_agreement.document_type, 'cin.node-personal-document-marriage');
          assert.equal(personalSchema.properties.document_type.const, certificate.outputs.personal_document.document_type);
          assert.equal(marriageSchema.properties.document_type.const, certificate.outputs.marriage_agreement.document_type);
          assert.ok(lobby.includes('eth_signTypedData_v4'));
          assert.ok(lobby.includes('verifyTypedData'));
          assert.ok(lobby.includes('PREVIEW_NOT_ISSUED'));
          assert.ok(html.includes('ethers@6.13.5'));
          assert.ok(html.includes('createPersonalDocumentButton'));
          assert.ok(serviceWorker.includes('CIN-GLOBAL-PERSONAL-DOCUMENT.cincert'));
          console.log('CIN Global Personal Document certificate, Lobby integration and schemas validated.');
          NODE
