name: CIN Continuous Integration

# Automatic CI is intentionally paused while Main is rebuilt from a clean
# foundation. Keep manual dispatch available for an explicitly requested
# diagnostic run; no legacy Lobby or certificate tests run in this phase.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paused:
    name: Automatic validation paused for Main reset
    runs-on: ubuntu-latest
    steps:
      - name: Report reset state
        run: |
          echo "CIN Main reset is in progress."
          echo "Legacy validation suites are intentionally not executed."
          echo "Re-enable CI only after the new Main baseline and acceptance scope are approved."
