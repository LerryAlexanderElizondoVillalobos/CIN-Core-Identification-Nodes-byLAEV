name: CIN Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate repository baseline
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s docs/project/PROJECT_STATUS_AND_ROADMAP.md
          test -d docs
          test -d specifications
          test -d .github/workflows
          echo "Repository baseline is present."
      - name: Validate Markdown references
        run: python3 scripts/ci/validate_repository.py

  workflow-syntax:
    name: Workflow YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse workflow YAML
        run: |
          ruby -e 'require "yaml"; Dir.glob(".github/workflows/*.yml").each { |path| YAML.load_file(path); puts "Valid YAML: #{path}" }'
