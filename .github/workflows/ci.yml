name: CIN Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-validation:
    name: Repository and documentation validation
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate repository baseline
        run: |
          set -euo pipefail
          test -s README.md
          test -s CONTRIBUTING.md
          test -s docs/project/PROJECT_STATUS_AND_ROADMAP.md
          test -d docs
          test -d specifications
          test -d .github/workflows
          echo "Repository baseline is present."
      - name: Validate Markdown references
        run: python3 scripts/ci/validate_repository.py

  workflow-syntax:
    name: Workflow YAML syntax
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Parse workflow YAML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import yaml
          files = sorted(Path(".github/workflows").glob("*.yml"))
          if not files:
              raise SystemExit("No workflow YAML files found.")
          for path in files:
              with path.open(encoding="utf-8") as stream:
                  yaml.safe_load(stream)
              print(f"Valid YAML: {path}")
          PY
