name: CIN Debian 13 ARM64 — User Space Package

on:
  push:
    branches: [feature/debian13-user-space-deb]
    paths:
      - "MAIN/app/**"
      - "MAIN/tests/**"
      - "MAIN/installer/linux/**"
      - "MAIN/installer/debian13/**"
      - ".github/workflows/debian13-user-space-arm64.yml"
  pull_request:
    paths:
      - "MAIN/**"
      - ".github/workflows/debian13-user-space-arm64.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cin-debian13-user-space-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-test-package:
    runs-on: ubuntu-24.04-arm
    container:
      image: debian:13-slim
    timeout-minutes: 40
    steps:
      - name: Install Debian 13 ARM64 build dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git python3 python3-venv python3-dev python3-gi python3-cairo \
            gir1.2-gtk-4.0 libcairo2-dev libgirepository-2.0-dev librsvg2-bin \
            desktop-file-utils patchelf gcc pkg-config file wget zip dpkg-dev \
            xvfb dbus-x11 xauth util-linux
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install ARM64 linuxdeploy
        run: |
          wget -q "https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-aarch64.AppImage" -O /usr/local/bin/linuxdeploy
          chmod 0755 /usr/local/bin/linuxdeploy
      - name: Verify Debian and architecture
        run: |
          . /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = 13
          test "$(dpkg --print-architecture)" = arm64
          test "$(uname -m)" = aarch64
      - name: Run CIN source tests
        run: python3 -m unittest discover -s MAIN/tests -v
      - name: Validate installer scripts
        run: |
          bash -n MAIN/installer/linux/build-appimage.sh
          bash -n MAIN/installer/debian13/build-deb-zip-arm64.sh
          sh -n MAIN/installer/debian13/install-user.sh
          sh -n MAIN/installer/debian13/uninstall-user.sh
          python3 -m compileall -q MAIN/app MAIN/installer/linux/appimage_installer.py
      - name: Build CIN GTK AppDir
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bash MAIN/installer/linux/build-appimage.sh
      - name: Build CIN.deb and installer ZIP
        run: bash MAIN/installer/debian13/build-deb-zip-arm64.sh
      - name: Inspect package metadata and ZIP contents
        run: |
          set -euo pipefail
          test "$(dpkg-deb -f dist/CIN.deb Package)" = core-identification-nodes
          test "$(dpkg-deb -f dist/CIN.deb Architecture)" = arm64
          test "$(dpkg-deb -f dist/CIN.deb Version)" = 0.5.0
          dpkg-deb -c dist/CIN.deb | grep -q './opt/cin/AppDir/AppRun'
          unzip -l dist/CIN-Debian13-Installer.zip | grep -q 'CIN-Debian13-Installer/CIN.deb'
          unzip -l dist/CIN-Debian13-Installer.zip | grep -q 'CIN-Debian13-Installer/install-user.sh'
          unzip -l dist/CIN-Debian13-Installer.zip | grep -q 'CIN-Debian13-Installer/uninstall-user.sh'
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Test unprivileged install and uninstall
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash cin-test
          mkdir -p /tmp/cin-installer-test
          unzip -q dist/CIN-Debian13-Installer.zip -d /tmp/cin-installer-test
          chown -R cin-test:cin-test /tmp/cin-installer-test /home/cin-test
          runuser -u cin-test -- env HOME=/home/cin-test XDG_DATA_HOME=/home/cin-test/.local/share sh /tmp/cin-installer-test/CIN-Debian13-Installer/install-user.sh
          test -x /home/cin-test/.local/bin/cin
          test -x /home/cin-test/.local/bin/cin-uninstall
          test -x /home/cin-test/.local/opt/cin-main-lobby/AppDir/AppRun
          test -f /home/cin-test/.local/share/applications/cin.desktop
          test ! -e /opt/cin/AppDir
          test ! -e /usr/bin/cin
          mkdir -p /home/cin-test/.local/share/cin /home/cin-test/.config/cin /home/cin-test/.cache/cin
          touch /home/cin-test/.local/share/cin/preserve.test /home/cin-test/.config/cin/preserve.test /home/cin-test/.cache/cin/preserve.test
          runuser -u cin-test -- env HOME=/home/cin-test XDG_DATA_HOME=/home/cin-test/.local/share sh /tmp/cin-installer-test/CIN-Debian13-Installer/uninstall-user.sh
          test ! -e /home/cin-test/.local/opt/cin-main-lobby
          test ! -e /home/cin-test/.local/bin/cin
          test -f /home/cin-test/.local/share/cin/preserve.test
          test -f /home/cin-test/.config/cin/preserve.test
          test -f /home/cin-test/.cache/cin/preserve.test
      - name: GUI smoke test and memory observation
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          GDK_BACKEND: x11
        run: |
          set -euo pipefail
          useradd --create-home --shell /bin/bash cin-gui
          mkdir -p /home/cin-gui/.local/opt /home/cin-gui/.local/bin /home/cin-gui/.local/share
          chown -R cin-gui:cin-gui /home/cin-gui
          unzip -q dist/CIN-Debian13-Installer.zip -d /tmp/cin-gui-installer
          chown -R cin-gui:cin-gui /tmp/cin-gui-installer
          runuser -u cin-gui -- env HOME=/home/cin-gui XDG_DATA_HOME=/home/cin-gui/.local/share sh /tmp/cin-gui-installer/CIN-Debian13-Installer/install-user.sh
          dbus-run-session -- xvfb-run -a runuser -u cin-gui -- env HOME=/home/cin-gui XDG_DATA_HOME=/home/cin-gui/.local/share GDK_BACKEND=x11 /home/cin-gui/.local/bin/cin --smoke-test
      - name: Upload Debian 13 ARM64 distribution
        uses: actions/upload-artifact@v4
        with:
          name: CIN-Debian13-ARM64
          path: |
            dist/CIN.deb
            dist/CIN-Debian13-Installer.zip
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30
