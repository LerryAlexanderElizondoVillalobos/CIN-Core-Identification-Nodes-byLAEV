name: Implementation task
description: Define a bounded CIN implementation with verifiable acceptance criteria.
title: "[Implementation]: "
labels: ["type:implementation"]
body:
  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: One concrete behavior to implement.
    validations:
      required: true
  - type: textarea
    id: specification
    attributes:
      label: Specification and contract
      description: Link the normative specification; list inputs, outputs, states and errors.
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable conditions required to accept this work.
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: Automated tests
    validations:
      required: true
  - type: dropdown
    id: maturity
    attributes:
      label: Current maturity
      options: [Proposed, Specified, In development, Implemented, Tested, Integrated, Validated]
    validations:
      required: true
